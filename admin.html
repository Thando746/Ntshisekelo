<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Staff admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16323a; --ink-soft: #4a626a; --paper: #f6faf9; --card: #fff; --sky: #d7ecf3;
    --sun: #ffc83d; --open: #2b8a66; --closed: #b23a48; --line: #cfdfe2;
    --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
  .wrap { width: min(980px, 100% - 2rem); margin-inline: auto; }
  header { background: var(--sky); padding: 1rem 0; border-bottom: 2px solid var(--ink); }
  header .wrap { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  header h1 { font: 700 1.4rem var(--display); margin: 0; }
  header a { color: var(--ink); }
  h2 { font: 600 1.4rem var(--display); margin: 0 0 1rem; }
  section.card { background: var(--card); border: 2px solid var(--ink); border-radius: 18px; padding: 1.5rem; margin: 1.5rem 0; }
  label { display: grid; gap: .3rem; font-weight: 700; font-size: .92rem; }
  input, select, textarea {
    font: inherit; font-weight: 400; color: var(--ink); padding: .6rem .7rem;
    border: 2px solid var(--ink); border-radius: 10px; background: #fff; width: 100%;
  }
  textarea { min-height: 70px; resize: vertical; }
  .btn { font: 700 1rem var(--display); background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: .65rem 1.3rem; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  .btn.small { padding: .35rem .9rem; font-size: .9rem; }
  .btn.danger { background: var(--closed); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .full { grid-column: 1 / -1; }
  .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: .7rem 1.2rem; border-radius: 999px; display: none; z-index: 10; max-width: 92vw; text-align: center; }
  .toast.show { display: block; }
  .toast.err { background: var(--closed); }
  .hint { color: var(--ink-soft); font-size: .95rem; }
  .hint.dirty { color: var(--closed); font-weight: 700; }

  /* login */
  #login { max-width: 380px; margin: 4rem auto; }

  /* open/close switch */
  .status-row { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; }
  .switch { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .switch button { font: 700 1.05rem var(--display); border: 0; padding: .6rem 1.4rem; background: #fff; color: var(--ink); cursor: pointer; }
  .switch button.on-open { background: var(--open); color: #fff; }
  .switch button.on-closed { background: var(--closed); color: #fff; }

  /* groups */
  .group-row { display: grid; grid-template-columns: 1.2fr 1.2fr .7fr .8fr .6fr auto; gap: .7rem; align-items: end; margin-bottom: .8rem; }
  .group-row .free { font-weight: 700; padding-bottom: .65rem; color: var(--open); }

  /* applications */
  .apps-bar { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  .apps-bar select { width: auto; }
  .app { border-top: 2px solid var(--line); padding: 1rem 0; display: grid; gap: .4rem; }
  .app:first-of-type { border-top: 0; }
  .app-head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: baseline; }
  .app-head strong { font: 600 1.15rem var(--display); }
  .app small { color: var(--ink-soft); }
  .app-actions { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .app-actions select { width: auto; padding: .3rem .5rem; }

  @media (max-width: 720px) {
    .grid2 { grid-template-columns: 1fr; }
    .group-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div id="login">
  <section class="card">
    <h2>Staff login</h2>
    <form id="loginForm">
      <label>Password<input type="password" id="pw" autocomplete="current-password" required></label>
      <p><button class="btn" type="submit" id="loginBtn">Log in</button></p>
      <p class="hint">If the site has been idle, the first login can take up to a minute.</p>
    </form>
    <p><a href="/">Back to the public page</a></p>
  </section>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <h1>Staff admin</h1>
      <div><a href="/" target="_blank" rel="noopener">View public page</a> &nbsp; <button class="btn ghost small" id="logout" type="button">Log out</button></div>
    </div>
  </header>

  <div class="wrap">
    <section class="card">
      <h2>Applications</h2>
      <div class="status-row">
        <div class="switch" role="group" aria-label="Applications status">
          <button id="btnOpen" type="button">Open</button>
          <button id="btnClosed" type="button">Closed</button>
        </div>
        <span id="statusHint" class="hint"></span>
      </div>
      <p></p>
      <label>Message shown on the sign
        <textarea id="statusNote" placeholder="For example: Applications for the new year are open."></textarea>
      </label>
      <p><button class="btn" id="saveStatus" type="button">Save status</button></p>
    </section>

    <section class="card">
      <h2>Spaces in each age group</h2>
      <div id="groups"></div>
      <p>
        <button class="btn ghost" id="addGroup" type="button">Add age group</button>
        <button class="btn" id="saveGroups" type="button">Save spaces</button>
      </p>
    </section>

    <section class="card">
      <h2>Creche details</h2>
      <div class="grid2">
        <label>Creche name<input id="s_name"></label>
        <label>Tagline<input id="s_tagline"></label>
        <label>Phone<input id="s_phone"></label>
        <label>Email<input id="s_email"></label>
        <label class="full">Address<input id="s_address"></label>
        <label class="full">Opening hours<input id="s_hours"></label>
      </div>
      <p><button class="btn" id="saveDetails" type="button">Save details</button></p>
    </section>

    <section class="card">
      <h2>Applications received <span id="appCount"></span></h2>
      <div class="apps-bar">
        <label style="display:flex;align-items:center;gap:.5rem;">Show
          <select id="appFilter">
            <option value="all">All</option>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="waitlist">Waiting list</option>
            <option value="accepted">Accepted</option>
            <option value="declined">Declined</option>
          </select>
        </label>
        <button class="btn ghost small" id="exportCsv" type="button">Download list (CSV)</button>
      </div>
      <div id="apps"></div>
    </section>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Browser storage can be blocked (private mode), so never let it crash the page
  const store = {
    get(k) { try { return sessionStorage.getItem(k) || ""; } catch { return ""; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
    del(k) { try { sessionStorage.removeItem(k); } catch {} },
  };

  let token = store.get("creche_token");
  let data = null;
  let isOpen = true;

  function toast(text, err) {
    const t = $("toast");
    t.textContent = text;
    t.className = "toast show" + (err ? " err" : "");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => (t.className = "toast"), 3500);
  }

  async function api(path, method = "GET", body) {
    let res;
    try {
      res = await fetch(path, {
        method,
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch {
      throw new Error("Could not reach the server. Check your internet and try again.");
    }
    const out = await res.json().catch(() => ({}));
    if (res.status === 401 && token) logout();
    if (!res.ok) throw new Error(out.error || "Something went wrong.");
    return out;
  }

  /* ---------- login ---------- */
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("loginBtn");
    btn.disabled = true;
    btn.textContent = "Logging in…";
    try {
      const res = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("pw").value }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || "Could not log in.");
      token = out.token;
      store.set("creche_token", token);
      $("pw").value = "";
      await start();
    } catch (err) {
      toast(err.message || "Could not log in.", true);
    }
    btn.disabled = false;
    btn.textContent = "Log in";
  });

  function logout() {
    token = "";
    store.del("creche_token");
    $("app").hidden = true;
    $("login").hidden = false;
  }
  $("logout").addEventListener("click", logout);

  async function start() {
    try {
      data = await api("/api/admin/data");
    } catch (err) {
      toast(err.message, true);
      return;
    }
    $("login").hidden = true;
    $("app").hidden = false;
    fill();
  }

  /* ---------- fill screens ---------- */
  function fill() {
    const s = data.settings;
    isOpen = s.applicationsOpen;
    $("statusNote").value = s.statusNote || "";
    ["name", "tagline", "phone", "email", "address", "hours"].forEach((k) => ($("s_" + k).value = s[k] || ""));
    paintSwitch();
    paintGroups();
    paintApps();
  }

  /* ---------- open / closed ---------- */
  function paintSwitch() {
    $("btnOpen").className = isOpen ? "on-open" : "";
    $("btnClosed").className = !isOpen ? "on-closed" : "";
    paintHint();
  }
  function paintHint() {
    const s = data.settings;
    const changed = isOpen !== s.applicationsOpen || $("statusNote").value !== (s.statusNote || "");
    const h = $("statusHint");
    if (changed) {
      h.textContent = "Not saved yet. Click Save status to publish this.";
      h.className = "hint dirty";
    } else {
      h.textContent = isOpen ? "Applications are open. People can send applications." : "Applications are closed. The apply form is hidden from the public.";
      h.className = "hint";
    }
  }
  $("btnOpen").onclick = () => { isOpen = true; paintSwitch(); };
  $("btnClosed").onclick = () => { isOpen = false; paintSwitch(); };
  $("statusNote").addEventListener("input", paintHint);

  /* ---------- settings (status and details save separately) ---------- */
  function bodyFor(part) {
    const s = data.settings;
    const body = {
      name: s.name, tagline: s.tagline, phone: s.phone, email: s.email, address: s.address,
      hours: s.hours, statusNote: s.statusNote, applicationsOpen: s.applicationsOpen,
    };
    if (part === "status") {
      body.statusNote = $("statusNote").value;
      body.applicationsOpen = isOpen;
    } else {
      body.name = $("s_name").value;
      body.tagline = $("s_tagline").value;
      body.phone = $("s_phone").value;
      body.email = $("s_email").value;
      body.address = $("s_address").value;
      body.hours = $("s_hours").value;
    }
    return body;
  }
  async function saveSettings(part, msg, btn) {
    btn.disabled = true;
    try {
      const out = await api("/api/admin/settings", "PUT", bodyFor(part));
      data.settings = out.settings;
      paintHint();
      toast(msg);
    } catch (err) { toast(err.message, true); }
    btn.disabled = false;
  }
  $("saveStatus").onclick = (e) => saveSettings("status", "Status saved", e.currentTarget);
  $("saveDetails").onclick = (e) => saveSettings("details", "Details saved", e.currentTarget);

  /* ---------- groups ---------- */
  function paintGroups() {
    $("groups").innerHTML = data.groups.map((g, i) => `
      <div class="group-row" data-i="${i}">
        <label>Group name<input data-f="name" value="${esc(g.name)}"></label>
        <label>Ages<input data-f="ageRange" value="${esc(g.ageRange)}"></label>
        <label>Total places<input data-f="capacity" type="number" min="0" value="${esc(g.capacity)}"></label>
        <label>Children enrolled<input data-f="enrolled" type="number" min="0" value="${esc(g.enrolled)}"></label>
        <div class="free" data-free>${Math.max(0, (+g.capacity || 0) - (+g.enrolled || 0))} free</div>
        <button class="btn danger small" data-remove="${i}" type="button" aria-label="Remove ${esc(g.name)}">Remove</button>
      </div>`).join("") || "<p>No age groups yet. Add one below.</p>";
  }
  function readGroups() {
    return [...document.querySelectorAll(".group-row")].map((row) => {
      const g = { id: data.groups[+row.dataset.i].id };
      row.querySelectorAll("input").forEach((inp) => (g[inp.dataset.f] = inp.value));
      return g;
    });
  }
  $("groups").addEventListener("input", (e) => {
    const row = e.target.closest(".group-row");
    if (!row) return;
    const cap = parseInt(row.querySelector('[data-f="capacity"]').value, 10) || 0;
    const enr = parseInt(row.querySelector('[data-f="enrolled"]').value, 10) || 0;
    row.querySelector("[data-free]").textContent = Math.max(0, cap - enr) + " free";
  });
  $("groups").addEventListener("click", (e) => {
    const idx = e.target.dataset.remove;
    if (idx === undefined) return;
    data.groups = readGroups();
    data.groups.splice(+idx, 1);
    paintGroups();
    toast("Group removed. Click Save spaces to keep this change.");
  });
  $("addGroup").onclick = () => {
    data.groups = readGroups();
    data.groups.push({ id: "g" + Date.now(), name: "", ageRange: "", capacity: 10, enrolled: 0 });
    paintGroups();
  };
  $("saveGroups").onclick = async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      const out = await api("/api/admin/groups", "PUT", { groups: readGroups() });
      data.groups = out.groups;
      paintGroups();
      paintApps();
      toast("Spaces saved");
    } catch (err) { toast(err.message, true); }
    btn.disabled = false;
  };

  /* ---------- applications ---------- */
  const STATUSES = [["new", "New"], ["contacted", "Contacted"], ["waitlist", "Waiting list"], ["accepted", "Accepted"], ["declined", "Declined"]];

  function paintApps() {
    const all = data.applications;
    const filter = $("appFilter").value;
    const list = filter === "all" ? all : all.filter((a) => a.status === filter);
    $("appCount").textContent = all.length ? `(${all.length})` : "";
    $("apps").innerHTML = list.map((a) => {
      const g = data.groups.find((x) => x.id === a.groupId);
      const d = new Date(a.createdAt).toLocaleString();
      return `
      <div class="app" data-id="${esc(a.id)}">
        <div class="app-head"><strong>${esc(a.childName)}</strong><small>${esc(d)}</small></div>
        <div>Born ${esc(a.childBirthDate)} &middot; ${esc(g ? g.name : "Unknown group")}</div>
        <div>Parent: ${esc(a.parentName)} &middot; <a href="tel:${esc(a.phone)}">${esc(a.phone)}</a>${a.email ? ` &middot; <a href="mailto:${esc(a.email)}">${esc(a.email)}</a>` : ""}</div>
        ${a.message ? `<div><small>Note:</small> ${esc(a.message)}</div>` : ""}
        <div class="app-actions">
          <select data-status aria-label="Status for ${esc(a.childName)}">
            ${STATUSES.map(([v, l]) => `<option value="${v}" ${a.status === v ? "selected" : ""}>${l}</option>`).join("")}
          </select>
          <button class="btn danger small" data-del type="button">Delete</button>
        </div>
      </div>`;
    }).join("") || (all.length ? "<p>No applications with this status.</p>" : "<p>No applications yet.</p>");
  }
  $("appFilter").addEventListener("change", paintApps);

  $("apps").addEventListener("change", async (e) => {
    if (!e.target.matches("[data-status]")) return;
    const id = e.target.closest(".app").dataset.id;
    const a = data.applications.find((x) => x.id === id);
    const previous = a ? a.status : "new";
    try {
      await api("/api/admin/applications/" + id, "PATCH", { status: e.target.value });
      if (a) a.status = e.target.value;
      toast("Status updated");
    } catch (err) {
      e.target.value = previous;
      toast(err.message, true);
    }
  });
  $("apps").addEventListener("click", async (e) => {
    if (!e.target.matches("[data-del]")) return;
    if (!confirm("Delete this application? This cannot be undone.")) return;
    const id = e.target.closest(".app").dataset.id;
    try {
      await api("/api/admin/applications/" + id, "DELETE");
      data.applications = data.applications.filter((a) => a.id !== id);
      paintApps();
      toast("Application deleted");
    } catch (err) { toast(err.message, true); }
  });

  /* ---------- download list as CSV ---------- */
  function csvCell(v) {
    let t = String(v ?? "");
    if (/^[=@\t\r]|^[+\-]\D/.test(t)) t = "'" + t; // stops spreadsheet formulas from running
    return '"' + t.replace(/"/g, '""') + '"';
  }
  $("exportCsv").onclick = () => {
    if (!data.applications.length) { toast("There are no applications to download.", true); return; }
    const head = ["Received", "Child", "Date of birth", "Age group", "Parent", "Phone", "Email", "Status", "Note"];
    const rows = data.applications.map((a) => {
      const g = data.groups.find((x) => x.id === a.groupId);
      return [a.createdAt, a.childName, a.childBirthDate, g ? g.name : "", a.parentName, a.phone, a.email, a.status, a.message];
    });
    const csv = [head, ...rows].map((r) => r.map(csvCell).join(",")).join("\r\n");
    const url = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = "applications.csv";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  };

  if (token) start();
</script>
</body>
</html>
